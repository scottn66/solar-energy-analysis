# Runs all tests on every push and PR.
# If tests fail, the commit/PR gets a red X on GitHub.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # Dummy API keys — all HTTP is mocked in the test suite, but the
        # modules assert the keys exist at call time. Real keys are not
        # needed (and should not be exposed) in CI.
        env:
          NREL_API_KEY: dummy_key_for_ci
          EIA_API_KEY: dummy_key_for_ci
        run: pytest test_solar_economics.py test_integration.py -v
